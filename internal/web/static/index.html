<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark light">
<!-- No inline script and no foreign source. Second layer behind the preview
     dialog's node-by-node rendering: an object key that somehow reached markup
     still cannot drag an inline handler in with it. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; media-src 'self'; frame-src 'self'; object-src 'none'; base-uri 'none'; form-action 'self'">
<title>scc {{SCC_VERSION}}</title>
<link rel="icon" type="image/svg+xml" href="/static/logo.svg">
<script src="/static/theme.js"></script>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<aside id="sidebar" aria-label="账户与桶">
  <div class="brand">
    <img class="logo" src="/static/logo.svg" width="22" height="22" alt="">
    <div class="brand-title">
      <span>scc</span>
      <span id="version" class="version" title="scc {{SCC_VERSION}}" aria-label="scc 版本 {{SCC_VERSION}}">{{SCC_VERSION}}</span>
    </div>
    <button id="theme" class="icon-btn" title="切换深色/浅色" aria-label="切换深色/浅色">
      <svg class="ico sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 3v2M12 19v2M3 12h2M19 12h2M5.6 5.6 7 7M17 17l1.4 1.4M5.6 18.4 7 17M17 7l1.4-1.4"/></svg>
      <svg class="ico moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8.5 8.5 0 0 1 9.5 4a8.5 8.5 0 1 0 10.5 10.5Z"/></svg>
    </button>
  </div>
  <div id="accounts"></div>
  <button id="addaccount" class="add-account">＋ 添加账户</button>
</aside>
<div id="scrim" hidden></div>

<main>
  <header>
    <button id="navtoggle" class="icon-btn drawer-only" type="button" title="账户与桶"
            aria-label="打开账户与桶" aria-controls="sidebar" aria-expanded="false">
      <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
    </button>
    <nav id="crumbs" aria-label="当前位置"></nav>
    <div class="search">
      <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m16.5 16.5 4.5 4.5"/></svg>
      <input id="q" type="search" placeholder="过滤 · 回车跳转前缀"
             title="输入即过滤已加载的项；按回车把这个前缀当作目录跳过去，不受已加载页数限制"
             aria-label="过滤已加载项；回车按前缀跳转" autocomplete="off" spellcheck="false">
      <button id="qclear" class="icon-btn clear" type="button" title="清除" aria-label="清除过滤" hidden>×</button>
    </div>
    <div class="tools">
      <button id="refresh" class="icon-btn" title="刷新" aria-label="刷新">
        <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 12a8 8 0 1 1-2.4-5.7M20 4.5V10h-5.5"/></svg>
      </button>
      <button id="newfolder" class="btn-secondary" title="在当前目录新建文件夹" type="button">
        <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2ZM12 10.5v5M9.5 13h5"/></svg>
        新建文件夹
      </button>
      <button id="more" class="icon-btn narrow-only" type="button" title="更多操作"
              aria-label="更多操作" aria-haspopup="menu" aria-expanded="false">⋯</button>
      <div id="moremenu" class="menu" role="menu" aria-label="更多操作" hidden>
        <button type="button" role="menuitem" data-act="refresh">刷新</button>
        <button type="button" role="menuitem" data-act="newfolder">新建文件夹</button>
      </div>
      <label class="btn btn-primary">
        <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 15V4m0 0 4 4m-4-4L8 8M5 19h14"/></svg>
        上传<input id="upload" type="file" multiple hidden>
      </label>
    </div>
  </header>

  <div id="selbar" hidden>
    <span id="selcount" aria-live="polite"></span>
    <div class="sel-actions">
      <button id="seldownload" class="ghost" type="button">下载</button>
      <button id="seldelete" class="ghost danger" type="button">删除</button>
      <button id="selclear" class="ghost" type="button">取消选择</button>
    </div>
  </div>

  <div class="table-wrap">
    <table>
      <colgroup>
        <col class="c-check"><col class="c-name"><col class="c-size"><col class="c-date"><col class="c-act">
      </colgroup>
      <thead>
        <tr>
          <th class="check"><input id="checkall" type="checkbox" aria-label="全选当前列出的项"></th>
          <th><button class="sort" type="button" data-col="name">名称<i class="arrow" aria-hidden="true"></i></button></th>
          <th class="num"><button class="sort" type="button" data-col="size">大小<i class="arrow" aria-hidden="true"></i></button></th>
          <th class="date"><button class="sort" type="button" data-col="date">修改时间<i class="arrow" aria-hidden="true"></i></button></th>
          <th class="act"><span class="sr-only">操作</span></th>
        </tr>
      </thead>
      <tbody id="rows"></tbody>
    </table>
    <div id="empty" class="hint" hidden></div>
  </div>
  <div id="toasts" role="region" aria-label="通知">
    <div id="msgs" aria-live="polite"></div>
    <div id="progress" class="toast" hidden>
      <div class="bar"><i></i></div>
      <div class="lab" aria-live="polite"></div>
      <button class="toast-cancel" type="button" hidden>取消</button>
    </div>
  </div>
</main>

<div id="modal" hidden role="dialog" aria-modal="true" aria-labelledby="mtitle">
  <div class="box">
    <div class="head">
      <div class="title">
        <span id="mtitle"></span>
        <span id="mmeta" class="meta"></span>
      </div>
      <div class="head-actions">
        <div class="pager" id="mpager">
          <button id="mprev" class="icon-btn" type="button" title="上一个（←）" aria-label="上一个文件">
            <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="m14.5 6-6 6 6 6"/></svg>
          </button>
          <span id="mpos" class="pos" aria-live="polite"></span>
          <button id="mnext" class="icon-btn" type="button" title="下一个（→）" aria-label="下一个文件">
            <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="m9.5 6 6 6-6 6"/></svg>
          </button>
        </div>
        <a id="mdownload" class="btn icon-btn" title="下载" aria-label="下载">
          <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4v11m0 0 4-4m-4 4-4-4M5 19h14"/></svg>
        </a>
        <a id="mopen" class="btn icon-btn" target="_blank" rel="noopener" title="新标签打开" aria-label="新标签打开">
          <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M14 4h6v6M20 4l-9 9M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5"/></svg>
        </a>
        <span class="divider" aria-hidden="true"></span>
        <button id="mclose" class="icon-btn" type="button" title="关闭（Esc）" aria-label="关闭">
          <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg>
        </button>
      </div>
    </div>
    <div id="mbody"></div>
  </div>
</div>

<div id="confirm" hidden role="alertdialog" aria-modal="true" aria-labelledby="ctext">
  <div class="box">
    <p id="ctext"></p>
    <div class="actions">
      <button id="ccancel" class="ghost" type="button">取消</button>
      <button id="cok" class="btn-danger" type="button">删除</button>
    </div>
  </div>
</div>

<div id="ask" hidden role="dialog" aria-modal="true" aria-labelledby="asktitle">
  <form class="box" id="askform">
    <p id="asktitle" class="ask-title"></p>
    <input id="askinput" type="text" autocomplete="off" spellcheck="false">
    <p id="askerr" class="ask-err" role="alert"></p>
    <div class="actions">
      <button id="askcancel" class="ghost" type="button">取消</button>
      <button id="askok" class="btn-primary" type="submit">确定</button>
    </div>
  </form>
</div>

<div id="dropzone" hidden aria-hidden="true">
  <div class="dz">
    <strong>松开即上传</strong>
    <span id="dzprefix"></span>
  </div>
</div>

<script type="module" src="/static/js/main.js"></script>
</body>
</html>
