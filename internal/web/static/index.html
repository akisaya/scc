<!doctype html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark light">
<title>scc</title>
<link rel="icon" type="image/svg+xml" href="/static/logo.svg">
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<aside>
  <div class="brand">
    <img class="logo" src="/static/logo.svg" width="22" height="22" alt="">
    <span>scc</span>
    <button id="theme" class="icon-btn" title="切换深色/浅色" aria-label="切换深色/浅色">
      <svg class="ico sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 3v2M12 19v2M3 12h2M19 12h2M5.6 5.6 7 7M17 17l1.4 1.4M5.6 18.4 7 17M17 7l1.4-1.4"/></svg>
      <svg class="ico moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8.5 8.5 0 0 1 9.5 4a8.5 8.5 0 1 0 10.5 10.5Z"/></svg>
    </button>
  </div>
  <div id="accounts"></div>
  <button id="addaccount" class="add-account">＋ 添加账户</button>
</aside>

<main>
  <header>
    <nav id="crumbs"></nav>
    <input id="jumpprefix" class="filter jump" type="text" placeholder="跳到前缀，回车"
           title="按 S3 前缀直接跳转，不受已加载页数限制"
           aria-label="按前缀跳转" autocomplete="off" spellcheck="false">
    <input id="filter" class="filter" type="search" placeholder="过滤已加载项" aria-label="过滤已加载项" autocomplete="off">
    <div class="tools">
      <button id="refresh" class="ghost" title="刷新">刷新</button>
      <button id="newfolder" class="ghost" title="在当前目录新建文件夹">新建文件夹</button>
      <label class="btn btn-primary">上传<input id="upload" type="file" multiple hidden></label>
    </div>
  </header>

  <div class="table-wrap">
    <table>
      <thead><tr><th>名称</th><th class="num">大小</th><th class="date">修改时间</th><th></th></tr></thead>
      <tbody id="rows"></tbody>
    </table>
    <div id="empty" class="hint" hidden></div>
  </div>
  <div id="progress"></div>
</main>

<div id="modal" hidden role="dialog" aria-modal="true" aria-label="文件预览">
  <div class="box">
    <div class="head">
      <div class="title">
        <span id="mtitle"></span>
        <span id="mmeta" class="meta"></span>
      </div>
      <div class="head-actions">
        <a id="mdownload" class="btn btn-primary">下载</a>
        <a id="mopen" class="btn ghost" target="_blank" rel="noopener">新标签打开</a>
        <button id="mclose" class="ghost">关闭</button>
      </div>
    </div>
    <div id="mbody"></div>
  </div>
</div>

<div id="confirm" hidden role="alertdialog" aria-modal="true" aria-labelledby="ctext">
  <div class="box">
    <p id="ctext"></p>
    <div class="actions">
      <button id="ccancel" class="ghost" type="button">取消</button>
      <button id="cok" class="btn-danger" type="button">删除</button>
    </div>
  </div>
</div>
<script src="/static/app.js"></script>
</body>
</html>
