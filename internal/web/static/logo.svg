<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" width="96" height="96" role="img" aria-label="scc">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3b6ef6"/>
      <stop offset="1" stop-color="#7c4dff"/>
    </linearGradient>
  </defs>
  <rect width="96" height="96" rx="24" fill="url(#g)"/>
  <!-- Two tangent C arcs: alone each is a "c", together they trace an "S".
       The circles meet at (48,48) on the line through their centres, so the
       stroke joins without a corner. -->
  <path d="M48 24 A17 17 0 1 0 48 48 A17 17 0 1 1 48 72"
        fill="none" stroke="#fff" stroke-width="9"
        stroke-linecap="round" stroke-linejoin="round"/>
</svg>
