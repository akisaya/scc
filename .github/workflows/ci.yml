name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt'd:"
            echo "$unformatted"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: go test
        run: go test -race ./...

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      # The UI has no build step, so there is nothing to bundle; a syntax check
      # is enough to catch a broken app.js before it ships inside the binary.
      - name: frontend syntax check
        run: node --check internal/web/static/app.js

  e2e:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # moto stands in for S3 here on purpose: MinIO's Docker Hub image is no
      # longer anonymously pullable, and a registry dependency is a flaky way to
      # test our own code. moto covers listing, Range, prefix deletes and both
      # path forms; AWS signature math is the SDK's problem, not ours.
      - name: Install S3 mock
        run: pip install "moto[server]"

      - name: Start S3 mock
        run: |
          nohup moto_server -p 19000 > moto.log 2>&1 &
          for _ in $(seq 1 30); do
            if curl -fsS -o /dev/null http://127.0.0.1:19000/; then exit 0; fi
            sleep 1
          done
          echo "the S3 mock did not start" >&2
          cat moto.log >&2
          exit 1

      - name: CLI end-to-end
        env:
          SCC_TEST_ENDPOINT: http://127.0.0.1:19000
        run: ./test/e2e-cli.sh

      - name: Web end-to-end
        env:
          SCC_TEST_ENDPOINT: http://127.0.0.1:19000
        run: ./test/e2e-web.sh
